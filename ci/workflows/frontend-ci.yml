name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-v2/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-v2/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package.json

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js PWA production bundle
        env:
          NEXT_PUBLIC_API_URL: https://emefast-v17.onrender.com/api
        run: npm run build

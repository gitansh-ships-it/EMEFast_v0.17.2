name: Bug Report
description: Report an issue or bug in EMEFast
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please provide detailed information to help diagnose the bug.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Frontend PWA (Next.js)
        - Backend API (FastAPI)
        - Database (PostgreSQL / SQLite)
        - Leaflet Map / Routing
        - Audio / Voice Memos
        - Deployment / CI/CD
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open emergency creation screen
        2. Enter patient vitals
        3. Submit case...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: OS, browser version, node/python version, deployment environment.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Browser: Chrome 128 / Safari 18
        - Node Version: 20.x
        - Python Version: 3.12

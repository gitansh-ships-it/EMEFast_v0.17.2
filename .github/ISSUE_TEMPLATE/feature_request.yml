name: Feature Request
description: Suggest an idea or architectural improvement for EMEFast
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the proposed feature or coordination capability clearly.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific challenge in emergency medical coordination?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Describe any alternative solutions or technical designs considered.
